<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact support for Mighty Movers. Get help, report issues, and share feedback.">
  <title>Mighty Movers Support</title>
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <nav class="nav-links" aria-label="Main navigation">
        <a href="/mighty_movers/">Mighty Movers</a>
        <a href="/mighty_movers/support.html">Support</a>
        <a href="/privacy_policy/mighty_movers.html">Privacy</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Mighty Movers Support</h1>
      <p class="lead">Questions, bug reports, or suggestions are always welcome.</p>
    </section>

    <section class="panel" style="max-width: 700px; margin: 0 auto 18px;">
      <h2 class="section-title">Contact</h2>
      <p>Email us directly at <strong>support@alvinyu.com</strong>.</p>
      <p>You can also use this quick form:</p>

      <form action="mailto:support@alvinyu.com" method="post" enctype="text/plain">
        <div class="form-row">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-row">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-row">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>
        </div>

        <input class="button" type="submit" value="Send">
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">&copy; 2026 Alvin Yu. All rights reserved.</div>
  </footer>
</body>
</html>
