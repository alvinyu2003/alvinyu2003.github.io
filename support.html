<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Support page for Alvin Yu apps.">
  <title>Support | Alvin Yu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #222;
    }

    h1, h2 {
      margin-bottom: 0.4em;
    }

    a {
      color: #0b57d0;
    }

    input,
    textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font: inherit;
      box-sizing: border-box;
    }

    input[type="submit"] {
      width: auto;
      cursor: pointer;
      padding: 8px 14px;
    }
  </style>
</head>
<body>
  <h1>Support</h1>
  <p>If you have questions, feedback, or bug reports, please email <strong>support@alvinyu.com</strong>.</p>

  <h2>Contact Form</h2>
  <form action="mailto:support@alvinyu.com" method="post" enctype="text/plain">
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Your Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <input type="submit" value="Send">
  </form>

  <p><a href="/">Back to home</a></p>
</body>
</html>
